[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "yonerai-discord-suite"
version = "0.1.0a1"
license = { file = "LICENSE" }
description = "Modular Discord operations suite for YonerAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "discord.py>=2.7.1,<2.8",
  "Pillow>=12.3,<13",
  "PyNaCl>=1.6.2,<1.7",
  "davey>=0.1.0,<0.2",
  "playwright>=1.48,<2",
  "python-dotenv>=1.0,<2",
  "qrcode>=8.2,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.15,<0.16",
]

[project.scripts]
yonerai-discord = "yonerai_discord.main:main"
yonerai-discord-audio-doctor = "yonerai_discord.modules.audio_core.doctor:main"
yonerai-discord-preview = "yonerai_discord.offline_preview:main"
yonerai-discord-renderer-doctor = "yonerai_discord.discord_renderer_doctor:main"
yonerai-discord-sandbox-doctor = "yonerai_discord.sandbox_doctor:main"
yonerai-discord-web-doctor = "yonerai_discord.web_doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yonerai_discord"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
