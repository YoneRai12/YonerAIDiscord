name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.lock
      - name: Static checks
        run: |
          ruff check src tests scripts ci
          ruff format --check src tests scripts ci
          python -m compileall -q src tests scripts ci
      - name: Capability catalog drift check
        run: |
          python scripts/generate_capability_catalog.py --check
          python scripts/generate_public_capability_truth.py --check-public
      - name: Secret and artifact preflight
        run: python scripts/security_preflight.py --workspace .
      - name: Tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Create clean wheelhouse
        run: >-
          python -I -c
          "import sys; from pathlib import Path;
          p=Path('.ci-wheelhouse');
          sys.exit(1) if p.exists() or p.is_symlink() else p.mkdir()"
      - name: Prepare public wheelhouse
        run: >-
          python -m pip download
          --only-binary=:all:
          --dest .ci-wheelhouse
          -r requirements.txt
          -c constraints.lock
          "hatchling==1.31.0"
      - name: Verify public package offline
        run: >-
          python ci/verify_public_package.py
          --source .
          --wheelhouse .ci-wheelhouse
          --output dist
